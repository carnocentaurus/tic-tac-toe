<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link href="/fonts/Roboto-Regular.woff2" type="font/woff2"
        rel="preload" as="font" crossorigin>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main>
        <dialog class="player-name-input-modal">
            <label for="player-one-name-input">
                Player one name

                <input
                    id="player-one-name-input"
                    minlength="1"
                    maxlength="20"
                    required
                >
            </label>

            <label for="player-two-name-input">
                Player two name

                <input
                    id="player-two-name-input"
                    minlength="1"
                    maxlength="20"
                    required
                >
            </label>

            <button class="player-name-confirm-button">Confirm</button>
        </dialog>

        <dialog class="error-modal">
            <p class="error-display"></p>
            <button class="error-modal-button">OK</button>
        </dialog>

        <dialog class="confirm-reset-modal">
            <h2>Reset Game</h2>

            <div class="keep-names-div">
                <h4>Keep Names</h4>
                <p>
                    The board is cleared, Player 1 goes first, 
                    and both players keep their current names.
                </p>
                <button class="keep-names-button">Keep Names</button>
            </div>

            <div class="complete-reset-div">
                <h4>Complete Reset</h4>
                <p>
                    The board is cleared, the current players are discareded, and the player-name
                    input modal opens so both players can enter new names.
                </p>
                <button class="complete-reset-button">Complete Reset</button>
            </div>
        </dialog>

        <div class="gameboard-div"></div>

        <div class="bottom-content-div">
            <p class="message-display"></p>
            <p class="reset-text">Reset</p>
        </div>
    </main>

    <script src="script.js"></script>
    
</body>
</html>
